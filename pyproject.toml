[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abert"
version = "0.1.0"
description = "Adaptive (elastic width + early exit) BERT for Banking77 intent classification at the edge"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
